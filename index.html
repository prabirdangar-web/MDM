<title>TFHS MDM – P1 / P2 / Form K</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--b:#1a3a5c;--g:#1b7f3b;--r:#c0392b;--l:#e8eef5}
*{box-sizing:border-box}body{font:13px/1.35 "Segoe UI",Arial,sans-serif;margin:0;color:#111;background:#f4f6f9}
nav{display:flex;gap:4px;padding:8px;background:var(--b);position:sticky;top:0;z-index:5;flex-wrap:wrap}
nav button{border:0;padding:7px 14px;border-radius:4px;background:#2d5a88;color:#fff;cursor:pointer}nav button.on{background:#fff;color:var(--b);font-weight:700}
nav .sp{flex:1}.pg{display:none;padding:12px;overflow-x:auto}.pg.on{display:block}
table{border-collapse:collapse;table-layout:fixed;width:100%;background:#fff}
th,td{border:1px solid #444;padding:3px 4px;height:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th{background:var(--l);text-align:center;font-weight:600}td.n{text-align:right;font-variant-numeric:tabular-nums}td.c{text-align:center}td.t{text-align:left}
tfoot td,tr.tot td{font-weight:700;background:#f2f2f2}
input{width:100%;border:1px solid #bbb;padding:2px 3px;font:inherit;text-align:right;background:#fffbe6}input.tx{text-align:left}
.hd{display:flex;align-items:center;gap:14px;border-bottom:2px solid #000;margin-bottom:8px;padding-bottom:6px}.hd img{height:74px}.hd h2{margin:0;font-size:17px}.hd div{text-align:center;flex:1}
.ok{color:var(--g);font-weight:700}.bad{color:var(--r);font-weight:700}tr.bad td{background:#fdecea}
.card{background:#fff;border:1px solid #ccc;padding:10px;margin-bottom:10px}.ban{padding:10px;font-weight:700;border-radius:4px;margin-bottom:10px}
.ban.ok{background:#e3f6e8}.ban.bad{background:#fdecea}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row label{display:flex;flex-direction:column;font-size:11px}
.row input{width:110px}pre{background:#fff;padding:10px;border:1px solid #ccc;white-space:pre-wrap}
@media print{nav,.noprint,col.noprint{display:none!important}body{background:#fff}@page{size:A4 portrait;margin:8mm}
.pg{display:none!important;padding:0;overflow:visible}.pg.on{display:flex!important;flex-direction:column;height:279mm;overflow:hidden}
#p_k.on{justify-content:space-between}#p_c.on>table:last-of-type{flex:1}#p_c.on>table:nth-of-type(1){flex:0 0 auto}.pg.on>table:only-of-type{flex:1}#p_rep.on>table{flex:none}
table{min-width:0!important;max-width:none!important;width:100%!important;margin:0 0 3px!important}
th,td{font-size:7pt;padding:1px 2px;height:auto;line-height:1.2}input,select{border:0;background:none;padding:0;appearance:none;-webkit-appearance:none;font:inherit}
.hd{margin-bottom:3px;padding-bottom:3px}.hd img{height:15mm}.hd h2{font-size:12pt}h3{margin:2px 0}p{margin:3px 0}.card{padding:3px;margin-bottom:3px}.ban{padding:3px;margin-bottom:3px}
#p_k div,#p_mdcf div{max-width:none!important}#p_k td,#p_k th{font-size:9.5pt;padding:3px 5px;white-space:normal}#p_k{font-size:9.5pt}
#p_p2 td,#p_p2 th{font-size:11pt;padding:4px 6px}#p_mdcf td,#p_mdcf th{font-size:8.5pt;padding:2px 5px;white-space:normal}
#p_p1 td,#p_p1 th{font-size:6.6pt;padding:1px}#p_c td,#p_c th{font-size:6.8pt}#p_dash td,#p_dash th{font-size:7.5pt}#p_mat td,#p_mat th{font-size:6.5pt}
#p_mdcf.on{display:block!important;height:auto;overflow:visible}.sheet{display:flex;flex-direction:column;height:279mm;overflow:hidden;page-break-after:always}.sheet:last-child{page-break-after:auto}
.fl{flex:1;display:flex;flex-direction:column}.fl>table{flex:1}}
.sheet{margin-bottom:20px}
body{padding-bottom:64px}
#login{position:fixed;inset:0;background:linear-gradient(160deg,#1a3a5c,#2d5a88);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#login form{background:#fff;border-radius:10px;padding:22px;width:100%;max-width:360px;box-shadow:0 10px 30px #0006}
#login h2{margin:0 0 4px;color:var(--b);font-size:18px}#login p{margin:0 0 14px;color:#555}
#login input{width:100%;text-align:left;padding:11px;font-size:16px;margin:0 0 10px;border:1px solid #aaa;border-radius:6px;background:#fff}
#login button.go{width:100%;padding:12px;font-size:16px;border:0;border-radius:6px;background:var(--b);color:#fff;font-weight:700}
#login .lk{background:none;border:0;color:var(--b);text-decoration:underline;padding:8px 0;font-size:13px}
#lmsg{min-height:18px;color:var(--r);font-weight:600;margin-bottom:6px;font-size:13px}
#sbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--b);display:none;align-items:center;gap:6px;padding:8px;z-index:9}
#sbar button{border:0;border-radius:6px;padding:11px 14px;font-size:15px;background:#2d5a88;color:#fff}
#sbar #sv{background:var(--g);font-weight:700;flex:1}#sbar #sv.dirty{background:var(--r)}
#sbar input{width:auto;flex:1.4;text-align:center;font-size:15px;padding:8px;border-radius:6px;background:#fff}
#sst{font-size:11px;color:#555;text-align:center;padding:2px}
.mh{max-width:640px;margin:auto}.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.chip{background:#fff;border:1px solid #ccc;border-radius:8px;padding:8px}.chip small{display:block;color:#555}.chip b{font-size:17px}
.mcard{background:#fff;border:1px solid #bbb;border-radius:10px;padding:10px;margin-bottom:10px}
.mcard.bad{border-color:var(--r);background:#fff5f4}.mcard.hol{background:#fff3d6;border-color:#e0b64d}
.mcard h4{margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:6px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcard label,.mh details label{display:flex;flex-direction:column;font-size:11px;color:#444}
.mcard input,.mh details input{width:100%;font-size:16px;padding:8px 6px;text-align:right;border:1px solid #999;border-radius:6px;background:#fffbe6}
.mcard input.tx{text-align:left}.mcard input:disabled,.mh details input:disabled{background:#eee;color:#555}
.mb{border:0;border-radius:6px;padding:7px 10px;background:#2d5a88;color:#fff;font-size:12px}.mb.o{background:#fff;color:var(--b);border:1px solid var(--b)}
.mh details{background:#fff;border:1px solid #bbb;border-radius:10px;padding:10px;margin-bottom:10px}.mh summary{font-weight:700;cursor:pointer}
.mini{font-size:12px;color:#444;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px}
@media(max-width:700px){nav{flex-wrap:nowrap;overflow-x:auto}nav button{white-space:nowrap;flex:none}.pg{padding:8px}}
@media print{#login,#sbar,#p_m{display:none!important}body{padding-bottom:0}}

@media print{#p_k.on{justify-content:flex-start!important;overflow:visible!important;height:auto!important;min-height:0}
#p_k td,#p_k th{font-size:9pt!important;padding:2px 5px!important}
#p_k .ksig{margin-top:16mm!important;display:grid!important;grid-template-columns:1fr 1fr 1fr;gap:6mm;page-break-inside:avoid;font-size:9pt}
#p_k .ksig span{border-top:1px solid #000;padding-top:3px;display:block}}
@media print{#p_p2.on>table:only-of-type{flex:none!important}#p_p2 input{text-align:right}#p_p2 input.tx{text-align:left}}
</style></head><body>
<div id="login"><form onsubmit="doLogin(event)"><h2>TFHS Mid Day Meal</h2><p>Sign in with your portal account (same login as the XI Exam portal).</p>
<input id="le" type="email" placeholder="Email" autocomplete="username" required><input id="lp" type="password" placeholder="Password" autocomplete="current-password" required>
<div id="lmsg"></div><button class="go" type="submit">Sign in</button><button type="button" class="lk" onclick="forgot()">Forgot password?</button></form></div>
<div id="sbar" class="noprint"><button onclick="stepMonth(-1)">◀</button><input type="month" id="mon" onchange="gotoMonth(this.value)"><button onclick="stepMonth(1)">▶</button><button id="sv" onclick="saveMonth()">Save</button></div>
<nav id="nav"></nav>
<div class="pg" id="p_m"></div><div class="pg" id="p_dash"></div><div class="pg" id="p_entry"></div><div class="pg" id="p_mat"></div><div class="pg" id="p_p1"></div>
<div class="pg" id="p_p2"></div><div class="pg" id="p_k"></div><div class="pg" id="p_c"></div><div class="pg" id="p_mdcf"></div><div class="pg" id="p_rep"></div>

 <details><summary>Payments &amp; vouchers (P2 synopsis)</summary><div class="g2" style="margin-top:8px"><label>Chicken (voucher)${mi(S.syn.chk||0,"setSy(this.value)")}</label><label>JALANI paid ₹${mi(S.pay.jal||0,"setPy('jal',this.value)")}</label><label>SHG market ₹${mi(S.pay.shgm||0,"setPy('shgm',this.value)")}</label><label>Chicken paid ₹${mi(S.pay.chk||0,"setPy('chk',this.value)")}</label></div>

 <button class="mb" style="margin-top:8px" onclick="addPyO()">+ Add payment line</button><div class="mini"><span>Total paid ${f2(Y.pt)}</span><span>Claimed ${f0(Y.cm)}</span></div></details>`;

  const bad=!o.ok;
